[package]
name = "media"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = []
integration-tests = ["media-storage/integration-tests"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
media-api = { path = "../media-api", version = "=0.1.0" }
media-contract = { path = "../media-contract", version = "=0.1.0" }
media-core = { path = "../media-core", version = "=0.1.0" }
media-runner = { path = "../media-runner", version = "=0.1.0" }
media-storage = { path = "../media-storage", version = "=0.1.0" }
reqwest.workspace = true
rezka-client = { path = "../rezka-client", version = "=0.1.0" }
secrecy.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "json"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
axum.workspace = true
cargo_metadata.workspace = true
testcontainers.workspace = true
tower.workspace = true
wait-timeout = "=0.2.1"

[[test]]
name = "postgres"
path = "tests/postgres.rs"
required-features = ["integration-tests"]

[[test]]
name = "service_composition"
path = "tests/service_composition.rs"
required-features = ["integration-tests"]

[lints]
workspace = true
