name: media-orchestrator

x-runtime-security: &runtime-security
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  postgres:
    image: ${MEDIA_POSTGRES_IMAGE:-postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193}
    environment:
      POSTGRES_DB: media_orchestrator
      POSTGRES_USER: media
      POSTGRES_PASSWORD: ${MEDIA_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U media -d media_orchestrator]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *runtime-security
    image: ${MEDIA_SERVICE_IMAGE:-media-orchestrator-service:local}
    command: [migrate]
    environment:
      MEDIA_DATABASE_URL: ${MEDIA_DATABASE_URL}
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    restart: no

  service:
    <<: *runtime-security
    image: ${MEDIA_SERVICE_IMAGE:-media-orchestrator-service:local}
    environment:
      MEDIA_DATABASE_URL: ${MEDIA_DATABASE_URL}
      MEDIA_PRIMARY_TOKEN: ${MEDIA_PRIMARY_TOKEN}
      MEDIA_SECONDARY_TOKEN: ${MEDIA_SECONDARY_TOKEN}
      MEDIA_RUNNER_TOKEN: ${MEDIA_RUNNER_TOKEN}
      MEDIA_LISTEN_ADDR: 0.0.0.0:8080
    networks: [backend]
    ports:
      - ${MEDIA_BIND_ADDRESS:-127.0.0.1}:${MEDIA_PORT:-8080}:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  runner:
    <<: *runtime-security
    profiles: [runner]
    image: ${MEDIA_RUNNER_IMAGE:-media-orchestrator-runner:local}
    environment:
      MEDIA_SERVICE_URL: http://service:8080
      MEDIA_TOKEN: ${MEDIA_RUNNER_TOKEN}
      MEDIA_REZKA_MIRRORS: ${MEDIA_REZKA_MIRRORS:-https://rezka.example.invalid}
      MEDIA_REZKA_SESSION_PROBE_URL: ${MEDIA_REZKA_SESSION_PROBE_URL:-https://rezka.example.invalid/}
      MEDIA_REZKA_SESSION_VALID_MARKERS_JSON: ${MEDIA_REZKA_SESSION_VALID_MARKERS_JSON:-["logout"]}
      MEDIA_REZKA_SESSION_INVALID_MARKERS_JSON: ${MEDIA_REZKA_SESSION_INVALID_MARKERS_JSON:-["login"]}
      MEDIA_REZKA_CREDENTIAL_BROKER_URL: ${MEDIA_REZKA_CREDENTIAL_BROKER_URL:-http://host.docker.internal:8787}
      MEDIA_REZKA_CREDENTIAL_BROKER_TOKEN: ${MEDIA_REZKA_CREDENTIAL_BROKER_TOKEN}
      MEDIA_REZKA_CREDENTIAL_BROKER_PRIVATE_HTTP_HOSTS: ${MEDIA_REZKA_CREDENTIAL_BROKER_PRIVATE_HTTP_HOSTS:-host.docker.internal}
      MEDIA_REZKA_COOKIE_KEY: ${MEDIA_REZKA_COOKIE_KEY}
      MEDIA_REZKA_SESSION_STORE_FILE: /var/lib/media/rezka-session.bin
      # Storage roots must live on the writable /media volume and share one
      # filesystem; the defaults (/staging/rezka, /plex/tv, /plex/movies) would
      # hit the read-only rootfs and fail the same-filesystem preflight.
      MEDIA_STAGING_ROOT: /media/staging
      MEDIA_STORAGE_RESERVE_BYTES: ${MEDIA_STORAGE_RESERVE_BYTES:-0}
      MEDIA_TV_ROOT: /media/tv
      MEDIA_MOVIES_ROOT: /media/movies
    volumes:
      - runner-state:/var/lib/media
      - ${MEDIA_LIBRARY_ROOT:-./.local/media}:/media
    devices:
      - ${MEDIA_DRI_DEVICE:-/dev/dri}:/dev/dri
    networks: [backend, runner-egress]
    depends_on:
      service:
        condition: service_healthy
    restart: unless-stopped

networks:
  backend:
    internal: true
  runner-egress: {}

volumes:
  postgres-data: {}
  runner-state: {}
