[workspace]
members = [
  "crates/media-core",
  "crates/media-contract",
  "crates/media",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.0"
version = "0.1.0"
publish = false

[workspace.dependencies]
assert_cmd = "=2.2.2"
async-trait = "=0.1.89"
cargo_metadata = "=0.23.1"
clap = { version = "=4.6.1", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
time = { version = "=0.3.53", default-features = false, features = ["std"] }
uuid = { version = "=1.23.4", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
