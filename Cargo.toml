[workspace]
members = [
  "crates/media-core",
  "crates/media-contract",
  "crates/media-api",
  "crates/media-storage",
  "crates/media",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.0"
version = "0.1.0"
publish = false

[workspace.dependencies]
assert_cmd = "=2.2.2"
async-trait = "=0.1.89"
axum = { version = "=0.8.9", features = ["json"] }
cargo_metadata = "=0.23.1"
clap = { version = "=4.6.1", features = ["derive"] }
futures-util = "=0.3.32"
http-body-util = "=0.1.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
secrecy = "=0.10.3"
sha2 = "=0.11.0"
sea-orm = { version = "=2.0.0-rc.42", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-json", "with-time", "with-uuid"] }
sea-orm-migration = { version = "=2.0.0-rc.42", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres", "with-json", "with-time", "with-uuid"] }
testcontainers = { version = "=0.27.3", default-features = false }
thiserror = "=2.0.18"
time = { version = "=0.3.53", default-features = false, features = ["std"] }
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread"] }
tower = { version = "=0.5.3", features = ["util"] }
uuid = { version = "=1.23.4", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
